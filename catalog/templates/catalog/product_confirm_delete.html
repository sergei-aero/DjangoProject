{% extends 'catalog/base.html' %}
{% block title %}Удаление товара{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Удалить товар "{{ object.name }}"?</h1>
    <p>Вы уверены, что хотите удалить этот товар? Действие необратимо.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
