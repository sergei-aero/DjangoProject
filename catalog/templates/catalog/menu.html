<nav class="ms-5">
    <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:product_list' %}">Каталог</a>
    <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:contacts' %}">Контакты</a>
    {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-info" href="{% url 'users:profile' %}">Профиль</a>
        <form action="{% url 'users:logout' %}" method="post" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="p-2 btn btn-outline-danger">Выйти</button>
        </form>
    {% else %}
        <a class="p-2 btn btn-outline-success" href="{% url 'users:login' %}">Войти</a>
        <a class="p-2 btn btn-outline-warning" href="{% url 'users:register' %}">Регистрация</a>
    {% endif %}
</nav>
